name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]

    steps:
      - name: Checkout OpenSSH
        uses: actions/checkout@v6
        with:
          repository: PowerShell/openssh-portable
          ref: refs/tags/v9.8.3.0
          path: openssh-portable

      - name: Install MSVC v142 Spectre-mitigated libs
        shell: powershell
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          Write-Host "Installing v142 Spectre-mitigated libraries..."

          $process = Start-Process -FilePath $vsInstaller -ArgumentList @(
            "modify",
            "--installPath", "`"C:\Program Files\Microsoft Visual Studio\2022\Enterprise`"",
            "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64.Spectre",
            "--quiet",
            "--norestart",
            "--wait"
          ) -Wait -PassThru -NoNewWindow

          Write-Host "Exit code: $($process.ExitCode)"

          # 0 = success, 3010 = success but restart required
          if ($process.ExitCode -notin @(0, 3010)) {
            Write-Error "Failed to install Spectre-mitigated libraries, exit code: $($process.ExitCode)"
            exit 1
          }

          Write-Host "✓ Spectre libs installed successfully"

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Build
        shell: pwsh
        working-directory: ./openssh-portable/contrib/win32/openssh
        run: |
          msbuild Win32-OpenSSH.sln `
            /nologo `
            /t:Rebuild `
            /p:Platform=x64 `
            /p:Configuration=Release `
            /p:PlatformToolset=v142

      - name: Copy libcrypto.dll
        shell: pwsh
        run: |
          $sourcePath = "${{ github.workspace }}\openssh-portable\contrib\win32\openssh\libressl\bin\desktop\x64\libcrypto.dll"
          $destPath = "${{ github.workspace }}\openssh-portable\bin\x64\Release"

          if (Test-Path $sourcePath) {
            Write-Host "Copying libcrypto.dll from $sourcePath to $destPath"
            Copy-Item $sourcePath $destPath -Force
          } else {
            Write-Host "libcrypto.dll not found at expected path, skipping copy"
          }

      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: openssh-${{ runner.os }}
          path: |
            openssh-portable/bin/x64/Release/
