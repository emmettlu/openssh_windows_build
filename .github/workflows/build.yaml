name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]

    steps:
      - name: Checkout OpenSSH source
        uses: actions/checkout@v6
        with:
          repository: PowerShell/openssh-portable
          ref: refs/tags/v9.8.3.0
          path: openssh-portable

      # - name: Setup MSBuild
      #   uses: microsoft/setup-msbuild@v2
      #   with:
      #     msbuild-architecture: x64

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Build
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\openssh-portable
          Import-Module .\contrib\win32\openssh\OpenSSHBuildHelper.psm1 -Force

          Write-Host "Building OpenSSH for ${{ matrix.arch }} ${{ matrix.config }}..."
          Start-OpenSSHBuild -Configuration ${{ matrix.config }} -NativeHostArch ${{ matrix.arch }}

          Write-Host "Packaging OpenSSH..."
          Start-OpenSSHPackage -Configuration ${{ matrix.config }} -NativeHostArch ${{ matrix.arch }}

      - name: Copy libcrypto.dll (first build or new version)
        shell: pwsh
        run: |
          $sourcePath = "${{ github.workspace }}\openssh-portable\contrib\win32\openssh\libressl\bin\desktop\${{ matrix.arch }}\libcrypto.dll"
          $destPath = "${{ github.workspace }}\openssh-portable\bin\${{ matrix.arch }}\${{ matrix.config }}"

          if (Test-Path $sourcePath) {
            Write-Host "Copying libcrypto.dll from $sourcePath to $destPath"
            Copy-Item $sourcePath $destPath -Force
          } else {
            Write-Host "libcrypto.dll not found at expected path, skipping copy"
          }

      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: openssh-${{ runner.os }}
          path: |
            openssh-portable/bin/x64/Release/
