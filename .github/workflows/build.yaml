name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]

    steps:
      - name: Checkout OpenSSH
        uses: actions/checkout@v6
        with:
          repository: PowerShell/openssh-portable
          ref: refs/tags/v9.8.3.0
          path: openssh-portable

      - name: Check VS Installer status with vswhere
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"

          # Show the latest instance details (nicely formatted)
          Write-Host "Latest instance:"
          & $vswhere -latest -format json | ConvertFrom-Json |
            Select-Object instanceId, installationPath, installationVersion, productId, channelId |
            Format-List

          # Show ALL instances (including legacy/Build Tools)
          Write-Host "`nAll instances (including legacy):"
          & $vswhere -all -legacy -format json | ConvertFrom-Json |
            Select-Object instanceId, installationPath, installationVersion, productId, channelId |
            Format-Table -AutoSize

          # Bonus: Check for v142 toolset components (if any instance has them)
          Write-Host "`nInstances with v142 toolset:"
          & $vswhere -all -legacy -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json |
            ConvertFrom-Json |
            Select-Object -Property installationPath, installationVersion |
            Format-Table -AutoSize

      - name: Modify - Add v142 Spectre
        shell: cmd
        run: |
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" modify ^
            --quiet --wait --norestart ^
            --add Microsoft.VisualStudio.Component.VC.v142.x86.x64.Spectre

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Build
        shell: pwsh
        working-directory: ./openssh-portable/contrib/win32/openssh
        run: |
          msbuild Win32-OpenSSH.sln `
            /nologo `
            /t:Rebuild `
            /p:Platform=x64 `
            /p:Configuration=Release `
            /p:PlatformToolset=v142

      - name: Copy libcrypto.dll
        shell: pwsh
        run: |
          $sourcePath = "${{ github.workspace }}\openssh-portable\contrib\win32\openssh\libressl\bin\desktop\x64\libcrypto.dll"
          $destPath = "${{ github.workspace }}\openssh-portable\bin\x64\Release"

          if (Test-Path $sourcePath) {
            Write-Host "Copying libcrypto.dll from $sourcePath to $destPath"
            Copy-Item $sourcePath $destPath -Force
          } else {
            Write-Host "libcrypto.dll not found at expected path, skipping copy"
          }

      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: openssh-${{ runner.os }}
          path: |
            openssh-portable/bin/x64/Release/
